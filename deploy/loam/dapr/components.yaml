# Dapr components for the validation. They live next to the bridge that
# consumes them (loam/dapr-bridge), so the trigger definitions and the code
# they start cannot drift apart.
#
# Hard constraint: no workflow backend component (`workflowbackend.*`) may ever
# be defined here or anywhere in the namespace. The bridge refuses to start if
# its sidecar reports one; Resonate is the only durability mechanism.
---
# External triggers: webhooks and AI-agent events are published here (through
# any sidecar's publish API, or the Dapr HTTP publish endpoint), and the bridge
# subscribes. Redis 7.2 is BSD-3-Clause (later Redis versions are not).
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: triggers
  namespace: loam
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis.loam.svc.cluster.local:6379
    - name: redisPassword
      value: ""
    # Redeliver an un-acked message after 5 s: exercises at-least-once.
    - name: processingTimeout
      value: "5s"
    - name: redeliverInterval
      value: "2s"
    # The default, 3, drops a message after three failed deliveries; a short
    # Resonate or TiKV outage then loses triggers (seen in the kill test).
    # The resiliency policy below spaces the attempts out.
    - name: maxRetries
      value: "30"
    - name: maxRetryBackoff
      value: "10s"
scopes:
  - bridge
  - trigger-publisher
---
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: loam
  namespace: loam
spec:
  tracing:
    samplingRate: "1"
    stdout: true
# mTLS between sidecars is on cluster-wide (dapr-system/daprsystem, the
# default); a per-namespace Configuration cannot turn it on or off.
---
# Inbound delivery to the bridge: back off exponentially, for up to ~5 min.
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: triggers
  namespace: loam
scopes:
  - bridge
spec:
  policies:
    retries:
      triggerDelivery:
        policy: exponential
        maxInterval: 15s
        maxRetries: 30
  targets:
    components:
      triggers:
        inbound:
          retry: triggerDelivery
