[package]
name = "resonate-dapr-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Loam: Dapr pub/sub, bindings and service invocation in, idempotent Resonate workflow starts out"
publish = false

# Its own workspace: Loam validation code, not part of the Resonate server
# workspace under impl/server/core.
[workspace]

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14"

[profile.release]
strip = true
