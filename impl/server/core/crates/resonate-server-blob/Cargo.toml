[package]
name = "resonate-server-blob"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
resonate-core = { version = "0.10.1", path = "../resonate-core" }
resonate-plugin = { version = "0.10.1", path = "../resonate-plugin" }
object_store = { version = "0.14.1", features = ["aws"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
cron = "0.12"
chrono = "0.4"
lazy_static = "1"
futures = "0.3"
fastrand = "2"
# Loam: TiKV through the loam fork of tikv-client (TSO reconnect, public
# protos, async-commit lock fixes), pinned by rev. Apache-2.0.
tikv-client = { git = "https://github.com/dina-kar/client-rust", rev = "1f8962b", default-features = false, optional = true }
# Loam: the durable single-process dev store. MIT OR Apache-2.0.
redb = { version = "3", optional = true }

[features]
tikv = ["dep:tikv-client"]
redb = ["dep:redb"]
